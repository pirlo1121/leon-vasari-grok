:root {
  --paper: #EDEBE6;
  --sheet: #F4F2ED;
  --ink: #141414;
  --muted: #6D6A63;
  --cobalt: #1F3FB0;
  --rule: rgba(20,20,20,.9);
  --ease: cubic-bezier(.2,.8,.2,1);
  --H: min(46vh, 31vw);
  --ws: 0px;
  --d: 0px;
  --sans: "Inter Tight", "Noto Sans JP", system-ui, sans-serif;
  --serif: "Newsreader", Georgia, serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  overflow: hidden;
  user-select: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

@media (pointer: fine) {
  html, body, button, a { cursor: none; }
}

.lbl {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 10.5px;
  line-height: 1;
  letter-spacing: .09em;
  text-transform: uppercase;
}

.box {
  display: inline-flex;
  align-items: center;
  height: 21px;
  padding: 0 8px;
  border: 1px solid var(--rule);
  background: transparent;
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  appearance: none;
  -webkit-appearance: none;
}

a { color: inherit; text-decoration: none; }

/* Paper grain */
.grain {
  position: fixed;
  inset: 0;
  z-index: 40;
  pointer-events: none;
  opacity: .55;
  mix-blend-mode: multiply;

  background-size: 220px 220px;
}

/* Top bar */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 84px;
  padding: 0 32px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  z-index: 30;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.topbar .back { justify-self: start; color: var(--ink); }
.topbar .career { justify-self: end; }

.logo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  color: var(--cobalt);
  text-align: center;
}
.logo .cn {
  font-family: "Noto Serif SC", serif;
  font-weight: 700;
  font-size: 22px;
  letter-spacing: .04em;
  line-height: 1;
}
.logo .en {
  font-family: var(--sans);
  font-weight: 600;
  font-size: 9px;
  letter-spacing: .34em;
  padding-left: .34em;
  line-height: 1;
}

/* Decade tabs */
.tabs {
  position: fixed;
  left: 50%;
  top: calc(50% - var(--H) / 2 - 86px);
  transform: translateX(-50%);
  display: flex;
  z-index: 30;
}
.tabs .ind {
  position: absolute;
  top: 0; left: 0;
  height: 23px;
  background: var(--cobalt);
  transition: width .6s var(--ease), transform .6s var(--ease);
  pointer-events: none;
  z-index: 0;
}
.tabs button {
  position: relative;
  z-index: 1;
  height: 23px;
  padding: 0 11px;
  border: 1px solid var(--rule);
  margin-left: -1px;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 10.5px;
  line-height: 1;
  letter-spacing: .09em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--ink);
  background: transparent;
  transition: color .45s var(--ease);
}
.tabs button:first-of-type { margin-left: 0; }
.tabs button.active { color: #fff; }

/* Shelf */
.shelf {
  position: fixed;
  left: 0; right: 0;
  top: calc(50% - var(--H) / 2 - 40px);
  height: calc(var(--H) + 80px);
  perspective: 2200px;
  perspective-origin: 50% 50%;
  touch-action: pan-y;
  z-index: 10;
}
.stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
  transform-style: preserve-3d;
}

.tape {
  position: absolute;
  left: 0; top: 0;
  width: 0; height: 0;
  transform-style: preserve-3d;
  will-change: transform;
}
.tape .face {
  position: absolute;
  top: 0;
  height: var(--H);
  background-repeat: no-repeat;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.tape .face::after {
  content: "";
  position: absolute;
  inset: 0;
  background: #000;
  opacity: var(--shade, 0);
  pointer-events: none;
}
.tape .sp {
  width: var(--ws);
  left: calc(var(--ws) / -2);
  transform: translateZ(calc(var(--d) / 2));
  --shade: 0;
}
.tape .cv {
  width: var(--d);
  left: calc(var(--d) / -2);
  transform: rotateY(90deg) translateZ(calc(var(--ws) / 2));
  --shade: .5;
  box-shadow: 0 30px 60px -28px rgba(20,16,10,.55);
}

/* Play ring */
.play {
  position: fixed;
  width: 42px;
  height: 42px;
  margin-left: -21px;
  margin-top: -21px;
  border-radius: 50%;
  border: 1px solid var(--cobalt);
  background: rgba(237,235,230,.75);
  color: var(--cobalt);
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: scale(0);
  pointer-events: auto;
}
.play svg {
  display: block;
  margin-left: 2px;
}

/* Caption */
.caption {
  position: fixed;
  left: 50%;
  top: calc(50% + var(--H) / 2 + 30px);
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  pointer-events: none;
  z-index: 20;
  text-align: center;
}
.cap-mask {
  position: relative;
  overflow: hidden;
  width: min(92vw, 760px);
  display: flex;
  justify-content: center;
}
.cap-mask .cap-line {
  display: block;
  position: relative;
  will-change: transform;
}
.cap-mask .cap-line.is-abs {
  position: absolute;
  left: 0; right: 0;
  top: 0;
}
.cap-title {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 31px;
  line-height: 1.12;
  letter-spacing: -.01em;
}
.cap-sub {
  font-weight: 500;
  color: var(--cobalt);
}
.cap-year {
  font-family: var(--sans);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: .08em;
}

/* Arrows */
.arrow {
  position: fixed;
  top: calc(50% + var(--H) / 2 + 40px);
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  z-index: 25;
}
.arrow.prev { left: 20px; }
.arrow.next { right: 20px; }

/* Footer */
.footer {
  position: fixed;
  left: 32px;
  right: 32px;
  bottom: 26px;
  display: flex;
  justify-content: space-between;
  z-index: 30;
}
.footer a { color: var(--ink); text-decoration: none; }

/* Custom cursor */
.cursor {
  position: fixed;
  left: 0; top: 0;
  width: 58px;
  height: 58px;
  margin: -29px 0 0 -29px;
  z-index: 100;
  pointer-events: none;
  display: none;
}
@media (pointer: fine) {
  .cursor { display: block; }
}
.cursor .ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1.5px solid var(--ink);
  background: transparent;
  transition: transform .5s var(--ease), background-color .4s var(--ease), border-color .4s var(--ease);
  transform: scale(1);
}
.cursor .dot {
  position: absolute;
  left: 50%; top: 50%;
  width: 6px; height: 6px;
  margin: -3px 0 0 -3px;
  border-radius: 50%;
  background: var(--ink);
  transition: transform .4s var(--ease);
  transform: scale(1);
}
.cursor .lab {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--sans);
  font-weight: 600;
  font-size: 10px;
  line-height: 1.25;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #fff;
  text-align: center;
  transition: transform .45s var(--ease);
  transform: scale(0);
}
.cursor.spine .ring { transform: scale(.72); }
.cursor.btn .ring { transform: scale(.55); }
.cursor.btn .dot { transform: scale(0); }
.cursor.open .ring {
  transform: scale(1.75);
  background: var(--cobalt);
  border-color: var(--cobalt);
}
.cursor.open .dot { transform: scale(0); }
.cursor.open .lab { transform: scale(1); }

/* Detail */
.detail {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: var(--sheet);
  visibility: hidden;
  overflow: hidden;
}
.detail.is-open { visibility: visible; }
.detail-close {
  position: absolute;
  top: 32px; left: 31px;
  z-index: 2;
}
.detail-logo {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 84px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
  pointer-events: none;
}
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4vw;
  padding: 110px 6vw 56px 7vw;
  height: 100%;
  align-items: center;
}
.detail-copy {
  display: flex;
  flex-direction: column;
  gap: 18px;
  max-width: 520px;
  justify-self: start;
}
.d-mask {
  overflow: hidden;
}
.d-mask > * {
  display: block;
  will-change: transform;
}
.d-sub { color: var(--cobalt); font-weight: 500; }
.d-title {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(44px, 5.4vw, 84px);
  line-height: 1;
  letter-spacing: -.025em;
}
.d-meta { color: var(--muted); font-weight: 500; }
.d-syn {

  font-size: 17px;

}
.d-credit {

}
.d-watch {

  color: var(--cobalt);
  background: transparent;
  font-family: var(--sans);

  letter-spacing: .09em;
  text-transform: uppercase;
}
.detail-poster {

  height: min(100%, 78vh);

  max-width: 100%;

.detail-poster svg {

}

@media (max-width: 767px) {

    const [url, W, H] = SHEET[sid];
    const sizeX = (W / w) * 100;
    const sizeY = (H / h) * 100;
    const posX = W === w ? 0 : (x / (W - w)) * 100;
    const posY = H === h ? 0 : (y / (H - h)) * 100;
    return {
      backgroundImage: `url(${url})`,
      backgroundSize: `${sizeX}% ${sizeY}%`,
      backgroundPosition: `${posX}% ${posY}%`,
    };
  }

  function smoothstep(x) {
    x = Math.max(0, Math.min(1, x));
    return x * x * (3 - 2 * x);
  }

  function B(r) {
    const a = Math.abs(r);
    if (a < 1) return (r + Math.sin(Math.PI * r) / Math.PI) / 2;
    return r < 0 ? -0.5 : 0.5;
  }

  function wrapRel(v, s) {
    let r = ((v - s) % TOTAL + TOTAL) % TOTAL;
    if (r > TOTAL / 2) r -= TOTAL;
    return r;
  }

  function shortestDelta(from, to) {
    let d = ((to - from) % N + N) % N;
    if (d > N / 2) d -= N;
    return d;
  }

  // DOM
  const stage = document.getElementById("stage");
  const shelf = document.getElementById("shelf");
  const playBtn = document.getElementById("play");
  const cursorEl = document.getElementById("cursor");
  const detail = document.getElementById("detail");
  const tabInd = document.getElementById("tabInd");
  const tabBtns = [...document.querySelectorAll(".tabs button")];
  const posterImg = document.getElementById("posterImg");
  const inkBlobs = [...document.querySelectorAll("#inkBlobs circle")];

  // Measure H
  let H = 0, ws = 0, d = 0, gap = 0, W = innerWidth;
  const probe = document.createElement("div");
  probe.style.cssText = "position:absolute;visibility:hidden;height:var(--H);pointer-events:none;";
  document.body.appendChild(probe);

  function measure() {
    W = innerWidth;
    H = probe.getBoundingClientRect().height;
    ws = H * 142 / 840;
    d = H * 474 / 900;
    gap = H * 0.03;
    stage.style.setProperty("--ws", ws + "px");
    stage.style.setProperty("--d", d + "px");
    // Reposition face tops using measured H via CSS var already
    tapes.forEach(t => {
      t.sp.style.top = -H / 2 + "px";
      t.cv.style.top = -H / 2 + "px";
      t.sp.style.height = H + "px";
      t.cv.style.height = H + "px";
    });
    updateTabInd();
  }

  // Build tapes
  const tapes = [];
  for (let copy = 0; copy < COPIES; copy++) {
    for (let i = 0; i < N; i++) {
      const film = FILMS[i];
      const v = copy * N + i;
      const el = document.createElement("div");
      el.className = "tape";
      el.dataset.v = v;
      el.dataset.i = i;

      const sp = document.createElement("div");
      sp.className = "face sp";
      Object.assign(sp.style, cropStyle("spine-" + film.id));

      const cv = document.createElement("div");
      cv.className = "face cv";
      Object.assign(cv.style, cropStyle("cover-" + film.id));

      el.appendChild(sp);
      el.appendChild(cv);
      stage.appendChild(el);

      const lift = { cur: 0, tgt: 0 };
      tapes.push({ el, sp, cv, v, i, lift, x: 0, r: 0 });

      el.addEventListener("pointerenter", () => { hover = v; });
      el.addEventListener("pointerleave", () => { if (hover === v) hover = -1; });
    }
  }

  // State
  let s = 17, T = 17;
  let hover = -1;
  let active = 5;
  let mx = W / 2, my = innerHeight / 2;
  let cx = mx, cy = my;
  let tiltX = 0, tiltY = 0;
  let onCover = false;
  let isOpen = false;
  let dragging = false, didDrag = false;
  let dragStartX = 0, dragT0 = 0;
  let wheelTimer = null;
  let lastT = performance.now();
  let inkRaf = 0;
  let detailAnims = [];

  // Caption init
  function setCaptionImmediate(film) {
    document.querySelector("#capTitle .cap-line").textContent = film.title;
    document.querySelector("#capSub .cap-line").textContent = film.romaji + " / " + film.kanji;
    document.querySelector("#capYear .cap-line").textContent = String(film.year);
  }
  setCaptionImmediate(FILMS[5]);

  function swapMask(maskEl, html, className, dir) {
    if (reduceMotion) {
      const line = maskEl.querySelector(".cap-line");
      if (line) line.innerHTML = html;
      else {
        maskEl.innerHTML = "";
        const span = document.createElement("span");
        span.className = "cap-line " + className;
        span.innerHTML = html;
        maskEl.appendChild(span);
      }
      return;
    }
    const olds = [...maskEl.querySelectorAll(".cap-line")];
    olds.forEach(o => {
      if (o.dataset.leaving) return;
      o.classList.add("is-abs");
      o.dataset.leaving = "1";
      const from = getComputedStyle(o).transform;
      o.animate(
        [
          { transform: from === "none" ? "translateY(0)" : from },
          { transform: `translateY(${-dir * 105}%)` },
        ],
        { duration: 650, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" }
      ).onfinish = () => o.remove();
    });
    const span = document.createElement("span");
    span.className = "cap-line " + className;
    span.innerHTML = html;
    maskEl.appendChild(span);
    span.animate(
      [
        { transform: `translateY(${dir * 105}%)` },
        { transform: "translateY(0)" },
      ],
      { duration: 650, easing: "cubic-bezier(.2,.8,.2,1)", fill: "both" }
    );
  }

  function setActive(idx, dir) {
    if (idx === active && document.querySelector("#capTitle .cap-line")?.textContent === FILMS[idx].title) {
      updateTabInd();
      return;
    }
    active = idx;
    const film = FILMS[idx];
    const ddir = dir || 1;
    swapMask(document.getElementById("capTitle"), film.title, "cap-title", ddir);
    swapMask(document.getElementById("capSub"), film.romaji + " / " + film.kanji, "lbl cap-sub", ddir);
    swapMask(document.getElementById("capYear"), String(film.year), "cap-year", ddir);
    updateTabInd();
  }

  function decadeOf(year) {
    return Math.floor(year / 10) * 10;
  }

  function updateTabInd() {
    const dec = decadeOf(FILMS[active].year);
    tabBtns.forEach(b => {
      const d = b.dataset.decade;
      b.classList.toggle("active", d !== "all" && Number(d) === dec);
    });
    const activeBtn = tabBtns.find(b => b.classList.contains("active"));
    if (!activeBtn) {
      tabInd.style.width = "0px";
      return;
    }
    tabInd.style.width = activeBtn.offsetWidth + "px";
    tabInd.style.transform = `translateX(${activeBtn.offsetLeft}px)`;
  }

  // Inputs
  tabBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      const dec = btn.dataset.decade;
      let target = 0;
      if (dec === "all") target = 0;
      else {
        const y0 = Number(dec);
        target = FILMS.findIndex(f => decadeOf(f.year) === y0);
        if (target < 0) target = 0;
      }
      const cur = ((Math.round(T) % N) + N) % N;
      T = Math.round(T) + shortestDelta(cur, target);
    });
  });

  document.getElementById("prev").addEventListener("click", () => { T = Math.round(T) - 1; });
  document.getElementById("next").addEventListener("click", () => { T = Math.round(T) + 1; });
  playBtn.addEventListener("click", () => openDetail());

  shelf.addEventListener("pointerdown", (e) => {
    if (isOpen) return;
    if (e.button != null && e.button !== 0) return;
    dragging = true;
    didDrag = false;
    dragStartX = e.clientX;
    dragT0 = T;
  });
  shelf.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - dragStartX;
    if (Math.abs(dx) > 5) {
      didDrag = true;
      T = dragT0 - dx / (ws + gap);
    }
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    if (didDrag) {
      T = Math.round(T);
      return;
    }
    // Clean click: activate the tape under the pointer (capture-free path)
    const top = document.elementFromPoint(e.clientX, e.clientY);
    const tapeEl = top && top.closest && top.closest(".tape");
    if (!tapeEl) return;
    const v = Number(tapeEl.dataset.v);
    const r = wrapRel(v, T);
    if (Math.abs(r) < 0.5) openDetail();
    else T = Math.round(T + r);
  }
  shelf.addEventListener("pointerup", endDrag);
  shelf.addEventListener("pointercancel", () => {
    if (!dragging) return;
    dragging = false;
    if (didDrag) T = Math.round(T);
  });

  shelf.addEventListener("wheel", (e) => {
    if (isOpen) return;
    e.preventDefault();
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    T += delta / (ws + gap) * 0.5;
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => { T = Math.round(T); }, 160);
  }, { passive: false });

  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && isOpen) { closeDetail(); return; }
    if (isOpen) return;
    if (e.key === "ArrowLeft") {
      T = Math.round(T) - 1;
      e.preventDefault();
      document.activeElement && document.activeElement.blur && document.activeElement.blur();
    } else if (e.key === "ArrowRight") {
      T = Math.round(T) + 1;
      e.preventDefault();
      document.activeElement && document.activeElement.blur && document.activeElement.blur();
    } else if (e.key === "Enter") {
      const ae = document.activeElement;
      const inDetail = ae && detail.contains(ae);
      const isTab = ae && ae.closest && ae.closest(".tabs");
      const isLink = ae && ae.tagName === "A";
      if (!inDetail && !isTab && !isLink) {
        openDetail();
        e.preventDefault();
      }
    }
  });

  document.getElementById("detailClose").addEventListener("click", closeDetail);

  window.addEventListener("pointermove", (e) => {
    mx = e.clientX;
    my = e.clientY;
  });

  // Cursor hit testing for btn state
  function hitBtn(el) {
    return el && (el.closest("button") || el.closest("a")) && !el.closest(".tape") && !el.closest(".play");
  }

  // Detail open/close
  function setPoster(film) {
    const [sid, x, y, w, h] = CROP["cover-" + film.id];
    const [url, SW, SH] = SHEET[sid];
    const imgX = -x * 474 / w;
    const imgY = -y * 900 / h;
    const imgW = SW * 474 / w;
    const imgH = SH * 900 / h;
    posterImg.setAttribute("href", url);
    posterImg.setAttributeNS("http://www.w3.org/1999/xlink", "href", url);
    posterImg.setAttribute("x", imgX);
    posterImg.setAttribute("y", imgY);
    posterImg.setAttribute("width", imgW);
    posterImg.setAttribute("height", imgH);
  }

  function fillDetail(film) {
    document.getElementById("dSub").textContent = film.romaji + " / " + film.kanji;
    document.getElementById("dTitle").textContent = film.title;
    document.getElementById("dMeta").textContent =
      `${film.year} / ${film.genre.toUpperCase()} / ${film.minutes} MIN`;
    document.getElementById("dSyn").textContent = film.synopsis;
    setPoster(film);
  }

  function coverRect() {
    const idx = tapes.findIndex(t => {
      const r = wrapRel(t.v, s);
      return Math.abs(r) < 0.5;
    });
    const t = tapes[idx >= 0 ? idx : 0];
    return t.cv.getBoundingClientRect();
  }

  function insetFromRect(rect) {
    const top = rect.top;
    const right = W - rect.right;
    const bottom = innerHeight - rect.bottom;
    const left = rect.left;
    return `inset(${top}px ${right}px ${bottom}px ${left}px round 3px)`;
  }

  function cancelDetailAnims() {
    detailAnims.forEach(a => { try { a.cancel(); } catch (_) {} });
    detailAnims = [];
    if (inkRaf) cancelAnimationFrame(inkRaf);
    inkRaf = 0;
  }

  function openDetail() {
    if (isOpen) return;
    isOpen = true;
    T = Math.round(T);
    s = T;
    const film = FILMS[((Math.round(s) % N) + N) % N];
    fillDetail(film);
    inkBlobs.forEach(c => c.setAttribute("r", "0"));

    const rect = coverRect();
    const originX = rect.left + rect.width / 2;
    const originY = rect.top + rect.height / 2;
    detail.style.transformOrigin = `${originX}px ${originY}px`;
    detail.classList.add("is-open");

    const dur = reduceMotion ? 1 : 1050;
    const ease = "cubic-bezier(.76,0,.18,1)";
    const fromClip = insetFromRect(rect);
    const anim = detail.animate(
      [
        { clipPath: fromClip, transform: "rotate(-4.5deg)" },
        { clipPath: "inset(0 0 0 0 round 0)", transform: "rotate(0deg)" },
      ],
      { duration: dur, easing: ease, fill: "both" }
    );
    detailAnims.push(anim);

    // Text rises
    const masks = [...detail.querySelectorAll(".d-mask > *")];
    masks.forEach((el, i) => {
      const delay = reduceMotion ? 0 : 620 + i * 75;
      const a = el.animate(
        [
          { transform: "translateY(110%)" },
          { transform: "translateY(0)" },
        ],
        {
          duration: reduceMotion ? 1 : 900,
          delay,
          easing: "cubic-bezier(.2,.8,.2,1)",
          fill: "both",
        }
      );
      detailAnims.push(a);
    });

    // Ink bleed
    const t0 = performance.now() - (reduceMotion ? 5000 : 0);
    const startAt = reduceMotion ? 0 : 520;
    function inkLoop(now) {
      const t = now - t0 - startAt;
      inkBlobs.forEach(c => {
        const delay = Number(c.dataset.delay);
        const p = Math.max(0, Math.min(1, (t - delay) / 1250));
        const eased = 1 - Math.pow(1 - p, 3);
        c.setAttribute("r", String(eased * 720));
      });
      if (t < 2400) inkRaf = requestAnimationFrame(inkLoop);
    }
    inkRaf = requestAnimationFrame(inkLoop);
  }

  function closeDetail() {
    if (!isOpen) return;
    cancelDetailAnims();
    const rect = coverRect();
    const originX = rect.left + rect.width / 2;
    const originY = rect.top + rect.height / 2;
    detail.style.transformOrigin = `${originX}px ${originY}px`;
    const toClip = insetFromRect(rect);
    const dur = reduceMotion ? 1 : 850;
    const anim = detail.animate(
      [
        { clipPath: "inset(0 0 0 0 round 0)", transform: "rotate(0deg)" },
        { clipPath: toClip, transform: "rotate(-4.5deg)" },
      ],
      { duration: dur, easing: "cubic-bezier(.76,0,.18,1)", fill: "both" }
    );
    detailAnims.push(anim);
    anim.onfinish = () => {
      detail.classList.remove("is-open");
      cancelDetailAnims();
      isOpen = false;
    };
  }

  // Main loop
  function frame(now) {
    let dt = Math.min(50, now - lastT) / 1000;
    lastT = now;
    if (dt <= 0) dt = 1 / 60;

    const k = reduceMotion ? 1e6 : (dragging && didDrag ? 18 : 5.2);
    const alpha = 1 - Math.exp(-k * dt);
    s += (T - s) * (reduceMotion ? 1 : alpha);
    if (Math.abs(T - s) < 1e-4) s = T;

    // Normalize loops
    if (Math.abs(s) > 4 * N) {
      const shift = Math.round(s / N) * N;
      s -= shift;
      T -= shift;
    }

    // Caption
    const roundS = ((Math.round(s) % N) + N) % N;
    if (roundS !== active) {
      const dir = Math.sign(T - s) || 1;
      setActive(roundS, dir);
    }

    // Cursor smooth
    const cA = 1 - Math.exp(-16 * dt);
    cx += (mx - cx) * cA;
    cy += (my - cy) * cA;
    cursorEl.style.transform = `translate3d(${cx}px, ${cy}px, 0)`;

    // Cover / tilt
    const shelfCy = shelf.getBoundingClientRect().top + shelf.getBoundingClientRect().height / 2;
    const nearCover =
      !isOpen &&
      Math.abs(T - s) < 0.3 &&
      Math.abs(mx - W / 2) < 0.55 * d &&
      Math.abs(my - shelfCy) < 0.55 * H;
    onCover = nearCover;

    let tgtTiltY, tgtTiltX;
    if (onCover) {
      tgtTiltY = ((mx - W / 2) / (0.55 * d)) * 9;
      tgtTiltX = -((my - shelfCy) / (H / 2)) * 6;
    } else {
      tgtTiltY = ((mx - W / 2) / W) * 5;
      tgtTiltX = 0;
    }
    const tA = 1 - Math.exp(-7 * dt);
    tiltY += (tgtTiltY - tiltY) * tA;
    tiltX += (tgtTiltX - tiltX) * tA;

    // Cursor state
    cursorEl.classList.remove("spine", "btn", "open");
    if (!isOpen) {
      if (onCover) cursorEl.classList.add("open");
      else {
        const under = document.elementFromPoint(mx, my);
        if (hitBtn(under)) cursorEl.classList.add("btn");
        else if (hover >= 0) {
          const hr = wrapRel(hover, s);
          if (Math.abs(hr) > 0.5) cursorEl.classList.add("spine");
        }
      }
    }

    // Lift targets
    tapes.forEach(t => {
      const r = wrapRel(t.v, s);
      t.r = r;
      const want = (hover === t.v && Math.abs(r) > 0.5) ? 1 : 0;
      t.lift.tgt = want;
      const lA = reduceMotion ? 1 : (1 - Math.exp(-12 * dt));
      t.lift.cur += (t.lift.tgt - t.lift.cur) * lA;
    });

    // Place tapes
    const half = W / 2 + 1.5 * d;
    tapes.forEach(t => {
      const r = t.r;
      const x = r * (ws + gap) + (d - ws + 1.6 * gap) * B(r);
      t.x = x;
      if (Math.abs(x) > half) {
        t.el.style.visibility = "hidden";
        return;
      }
      t.el.style.visibility = "visible";
      const o = smoothstep(Math.max(0, 1 - Math.abs(r)));
      const rotY = -90 * o + tiltY * o;
      const rotX = tiltX * o;
      const rotZ = -4.5 * o;
      const z = o * 0.2 * H;
      const y = -o * 0.025 * H - t.lift.cur * 0.045 * H;
      t.el.style.transform =
        `translate3d(${x}px, ${y}px, ${z}px) rotateZ(${rotZ}deg) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      t.el.style.zIndex = String(Math.round(100 - Math.abs(r) * 4));
      t.sp.style.setProperty("--shade", String(o * 0.55));
      t.cv.style.setProperty("--shade", String((1 - o) * 0.5));
    });

    // Play ring
    const playScale = isOpen
      ? 0
      : smoothstep(Math.max(0, 1 - Math.abs(T - s) * 3));
    const playLeft = W / 2 - 0.5 * d - 6;
    const playTop = shelfCy + 0.36 * H;
    playBtn.style.left = playLeft + "px";
    playBtn.style.top = playTop + "px";
    playBtn.style.transform = `scale(${playScale})`;
    playBtn.style.pointerEvents = playScale > 0.2 ? "auto" : "none";

    requestAnimationFrame(frame);
  }

  measure();
  updateTabInd();
  // Position face tops initially
  tapes.forEach(t => {
    t.sp.style.top = -H / 2 + "px";
    t.cv.style.top = -H / 2 + "px";
    t.sp.style.height = H + "px";
    t.cv.style.height = H + "px";
  });

  window.addEventListener("resize", () => {
    measure();
  });

  requestAnimationFrame((t) => {
    lastT = t;
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
